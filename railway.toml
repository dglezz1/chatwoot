# Chambeabot — root service defaults.
#
# Per-service overrides are applied via the per-service config in
# the Railway dashboard / API. The [build] section is intentionally
# left out so per-service config (dockerfilePath, builder) wins for
# crm-web (docker/Dockerfile), crm-worker (docker/Dockerfile),
# crm-openwa (openwa/Dockerfile.railway), crm-landing (RAILPACK).

# startCommand is intentionally left out so Railway uses the Procfile's
# `web:` and `worker:` lines (which hardcode PORT=3000). A literal
# `$PORT` here breaks Rails' --port parsing (Thor expects a number).

# preDeployCommand runs `bundle exec rails db:chatwoot_prepare` for
# crm-web + crm-worker. It is a no-op for crm-openwa (no bin/rails).
