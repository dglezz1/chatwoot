# Chambeabot — root service defaults.
#
# This file is read by Railway when `railway up` runs at this directory.
# It tells Railway to use the multi-stage Dockerfile under docker/.
#
# Per-service overrides (worker command, openwa image, etc.) are applied
# via `railway environment edit --service-config <svc> ...` after each
# service is added to the project.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

# startCommand is intentionally left out so Railway uses the Procfile's
# `web:` and `worker:` lines (which hardcode PORT=3000). A literal
# `$PORT` here breaks Rails' --port parsing (Thor expects a number).
[deploy]
preDeployCommand = "bundle exec rails db:chatwoot_prepare"
healthcheckPath = "/api"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5